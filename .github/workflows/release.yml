name: Release

# 自动打包并发布 GitHub Release：
#  - 推送 v* 标签（如 v1.0.0）时，自动为 Windows / macOS / Linux 构建并打包
#  - 打包产物自动上传到对应的 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建/更新 GitHub Release 需要写权限

env:
  # 避免前端构建（Vite）在 CI 低内存环境下 OOM
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 某个平台构建失败不影响其他平台
      matrix:
        include:
          - os: windows-latest
            wails_args: "-nsis -webview2 download" # NSIS 安装包 + 下载 WebView2
            artifact: pretty-json-windows
            upload_path: build/bin/*
          - os: macos-latest
            wails_args: ""
            artifact: pretty-json-macos
            upload_path: build/bin/pretty-json-macos.zip
          - os: ubuntu-22.04
            wails_args: ""
            artifact: pretty-json-linux
            upload_path: build/bin/pretty-json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 中的 go 指令保持一致（当前为 go 1.25.1）
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        # 与 go.mod 中依赖的 Wails 版本保持一致
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-0 libwebkit2gtk-4.0-dev

      - name: Build Wails app
        run: wails build -o pretty-json ${{ matrix.wails_args }}

      # macOS：给可执行文件加执行权限，并把 .app 打包成 zip 方便发布
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          chmod +x build/bin/pretty-json.app/Contents/MacOS/*
          ditto -c -k --keepParent build/bin/pretty-json.app build/bin/pretty-json-macos.zip

      - name: Make Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x build/bin/pretty-json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # 仅在打标签时创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pretty-json-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
