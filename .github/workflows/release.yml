name: Release

# 自动打包并发布 GitHub Release：
#  - 推送 v* 标签（如 v1.0.0）时，自动为 Windows / macOS / Linux 构建并打包
#  - 所有产物直接挂载到 GitHub Release 资产中，可一键下载、双击安装/运行
#  - 产物文件名统一带上版本号（tag 去掉 v，如 v1.0.0 -> 1.0.0）
#  - Windows: pretty-json-<ver>-windows-amd64.exe（便携） + -setup.exe（NSIS 安装器）
#  - macOS:   pretty-json-<ver>-macos.dmg（磁盘镜像，双击挂载安装，不打 zip）
#  - Linux:   pretty-json-<ver>-linux-x86_64.AppImage（双击直接运行）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建/更新 GitHub Release 需要写权限

env:
  # 避免前端构建（Vite）在 CI 低内存环境下 OOM
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 某个平台构建失败不影响其他平台
      matrix:
        include:
          - os: windows-latest
            build_args: "-nsis -webview2 download" # NSIS 安装包 + 下载 WebView2
            artifact: pretty-json-windows
            upload_path: build/bin/*-windows-amd64*
          - os: macos-latest
            build_args: ""
            artifact: pretty-json-macos
            upload_path: build/bin/*-macos.dmg
          - os: ubuntu-22.04
            build_args: ""
            artifact: pretty-json-linux
            upload_path: build/bin/*-linux-x86_64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 提取版本号：tag 推送 -> v1.0.0 去掉 v 得 1.0.0；手动触发 -> dev-<commit短hash>
      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 中的 go 指令保持一致（当前为 go 1.25.1）
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        # 与 go.mod 中依赖的 Wails 版本保持一致
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-0 libwebkit2gtk-4.0-dev

      - name: Build Wails app
        run: wails build -o pretty-json ${{ matrix.build_args }}

      # Windows：重命名便携版与 NSIS 安装器，带上版本号
      - name: Rename Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv build/bin/pretty-json.exe "build/bin/pretty-json-${VERSION}-windows-amd64.exe"
          mv build/bin/pretty-json-*-installer.exe "build/bin/pretty-json-${VERSION}-windows-amd64-setup.exe"

      # macOS：产出标准 .dmg 安装镜像（带版本号，非 zip）
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x build/bin/pretty-json.app/Contents/MacOS/*
          hdiutil create -volname "pretty-json" -srcfolder build/bin/pretty-json.app -ov -format UDZO "build/bin/pretty-json-${VERSION}-macos.dmg"

      # Linux：打包为 AppImage（带版本号与 .AppImage 后缀，双击即可运行）
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/bin/AppDir/usr/bin
          cp build/bin/pretty-json build/bin/AppDir/usr/bin/pretty-json
          chmod +x build/bin/AppDir/usr/bin/pretty-json
          mkdir -p build/bin/AppDir/usr/share/applications
          cat > build/bin/AppDir/pretty-json.desktop <<'EOF'
          [Desktop Entry]
          Name=pretty-json
          Exec=pretty-json
          Icon=pretty-json
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp build/bin/AppDir/pretty-json.desktop build/bin/AppDir/usr/share/applications/pretty-json.desktop
          # 图标必须放在 AppDir 根目录（appimagetool 只在此查找），hicolor 目录保留一份
          cp build/appicon.png build/bin/AppDir/pretty-json.png
          mkdir -p build/bin/AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/appicon.png build/bin/AppDir/usr/share/icons/hicolor/256x256/apps/pretty-json.png
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run build/bin/AppDir "build/bin/pretty-json-${VERSION}-linux-x86_64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # 仅在打标签时创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pretty-json-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
